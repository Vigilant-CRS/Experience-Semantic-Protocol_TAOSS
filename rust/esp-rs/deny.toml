#
# cargo-deny policy for esp-rs, used by scripts/security_review.py (`check advisories`).
# Every exception names exactly one advisory, with the reason. Any other advisory fails.

[advisories]
ignore = [
    # proc-macro-error2 is unmaintained (not a vulnerability). It is a compile-time
    # procedural-macro helper, pulled in only through hax-lib-macros -> libcrux-sha3 ->
    # hpke-rs -> openmls_rust_crypto (the MLS group layer, GAP-017, ADR-0021). No code
    # from it runs in the esp-rs binary, and no upgrade is available upstream yet.
    # Re-check when openmls_rust_crypto / hpke-rs update libcrux.
    { id = "RUSTSEC-2026-0173", reason = "unmaintained compile-time proc-macro via openmls_rust_crypto; no runtime code, no upgrade available" },
]

# Every dependency license must be compatible with AGPL-3.0-or-later (the crate's own license).
# Anything not listed fails `cargo deny check licenses`.
[licenses]
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9
