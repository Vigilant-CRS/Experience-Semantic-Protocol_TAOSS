[package]
name = "esp-rs"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Independent Rust implementation of the ESP V13 codec and session (WP-040/041)"
publish = false

[dependencies]
blake2 = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
half = "2"
hex = "0.4"
serde_json = "1"
snow = { version = "0.9", default-features = false, features = ["default-resolver", "risky-raw-split"] }  # ADR-0009 derives ESP keys from Split()
thiserror = "1"
# MLS (RFC 9420) group layer for the Typed Hive (GAP-017, ADR-0021); MIT-licensed
openmls = "0.9"
openmls_rust_crypto = "0.6"
openmls_basic_credential = "0.6"
openmls_traits = "0.6"
# Loading C-ABI neural vendor adapters (WP-090); ISC-licensed
libloading = "0.8"
zkryptium = { version = "0.7.1", default-features = false, features = ["bbsplus", "bbsplus_blind", "bbsplus_nym"] }

[dev-dependencies]
