[package]
name = "esp-rs"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Independent Rust implementation of the ESP V13 codec and session (WP-040/041)"
publish = false

[dependencies]
blake2 = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
half = "2"
hex = "0.4"
serde_json = "1"
snow = { version = "0.9", default-features = false, features = ["default-resolver", "risky-raw-split"] }  # ADR-0009 derives ESP keys from Split()
thiserror = "1"

[dev-dependencies]
