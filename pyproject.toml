[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "esp-taoss"
version = "0.0.1"
description = "Experience Semantic Protocol (ESP) V13 / TAOSS reference implementation"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Vigilant e.K. and contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "aioquic>=1.2",
    "cryptography>=43",
    "noiseprotocol>=0.3.1",
    "numpy>=2.0",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
]


[project.scripts]
esp-demo = "esp.demo.cli:main"

[project.urls]
Repository = "https://github.com/Vigilant-CRS/Experience-Semantic-Protocol_TAOSS"

[project.optional-dependencies]
physio = [
    "brainflow>=5.23.0",
    "pyedflib>=0.1.42",
    "pylsl>=1.18.5",
    "pyxdf>=1.17.5",
    "wfdb>=4.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "reuse>=4",
    "jsonschema>=4.23",
    "types-pyyaml>=6.0.12.20260906",
    "brainflow>=5.23.0",
    "pylsl>=1.18.5",
    "pyxdf>=1.17.5",
    "wfdb>=4.3.1",
    "pyedflib>=0.1.42",
]
train = [
    "torch>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/esp"]

[tool.hatch.build.targets.wheel.force-include]
"ontology" = "esp/_ontology"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "unit: fast unit tests",
    "property: hypothesis property tests",
    "integration: multi-component tests",
    "conformance: V13 conformance vectors",
    "security: security invariant tests",
    "fuzz: fuzz smoke tests",
    "milestone: milestone gate tests",
    "slow: long-running tests",
    "dataset: needs open datasets in data/external (scripts/fetch_datasets.py)",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["esp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PT", "PL", "ANN"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "PLR", "N802", "E741"]
"scripts/**" = ["T20", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["esp"]

[[tool.mypy.overrides]]
module = ["noise", "noise.*", "wfdb", "wfdb.*", "pyxdf", "pyxdf.*", "brainflow", "brainflow.*", "pylsl", "pylsl.*", "pyedflib", "pyedflib.*"]
ignore_missing_imports = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
default-groups = ["dev", "train"]
